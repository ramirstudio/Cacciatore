name: cerca

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      forza_fonti:
        description: "Rileggi subito tutti i negozi, senza aspettare le due ore"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cerca
  cancel-in-progress: false

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ricerca
        env:
          CACCIATORE_FORZA: ${{ inputs.forza_fonti && '1' || '' }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
          ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SECRET: ${{ secrets.ETSY_API_SECRET }}
          EMAIL_IMAP_UTENTE: ${{ secrets.EMAIL_IMAP_UTENTE }}
          EMAIL_IMAP_PASSWORD: ${{ secrets.EMAIL_IMAP_PASSWORD }}
        run: python -m cacciatore

      - name: Salva i dati
        run: |
          git config user.name "cacciatore"
          git config user.email "cacciatore@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nessuna novità da salvare."
          else
            git commit -m "dati"
            # il file dei dati viene riscritto da zero a ogni giro: in caso di conflitto vale la versione appena calcolata
            for tentativo in 1 2 3; do
              if git pull --rebase -X theirs && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "Salvataggio non riuscito: il prossimo giro riscriverà i dati."
            exit 1
          fi
