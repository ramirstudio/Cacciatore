name: cerca

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cerca
  cancel-in-progress: false

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ricerca
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
          ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SECRET: ${{ secrets.ETSY_API_SECRET }}
          EMAIL_IMAP_UTENTE: ${{ secrets.EMAIL_IMAP_UTENTE }}
          EMAIL_IMAP_PASSWORD: ${{ secrets.EMAIL_IMAP_PASSWORD }}
        run: python -m cacciatore

      - name: Salva i dati
        run: |
          git config user.name "cacciatore"
          git config user.email "cacciatore@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nessuna novità da salvare."
          else
            git commit -m "dati"
            git pull --rebase --autostash
            git push
          fi
