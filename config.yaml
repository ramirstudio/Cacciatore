# Impostazioni di Cacciatore. Si modifica direttamente su GitHub, senza toccare il codice.

generale:
  conserva_giorni: 10             # dopo quanti giorni senza vederlo un annuncio sparisce dal sito
  chiamate_per_esecuzione: 90     # limite eBay: 5.000 chiamate al giorno; 90 x 48 esecuzioni = 4.320
  quota_lontani: 25               # di queste 90, quante vanno ai paesi lontani (elenco paesi_lontani)
  max_avvisi_per_esecuzione: 12   # oltre questo numero Telegram riceve un solo messaggio riassuntivo
  risultati_per_chiamata: 100
  paesi_esclusi: [IT]             # i venditori italiani non interessano
  consegna_in: IT                 # eBay mostra solo annunci che spediscono qui
  categoria_ebay: "625"           # Fotocamere e foto. Se non esce nulla, lascia vuoto: ""

avvisi:
  soglia_punteggio: 5             # punteggio minimo (0-10) per l'avviso su un pezzo particolare
  affare_sotto_mediana: 0.60      # affare = costo totale sotto il 60% della mediana di mercato
  affare_minimo_annunci: 6        # servono almeno 6 annunci simili per calcolare la mediana
  affare_prezzo_minimo_eur: 15    # sotto questa cifra non è un affare ma un errore o un pezzo rotto
  riavvisa_se_ribasso: 0.20       # nuovo avviso se il prezzo scende di almeno il 20%

# Paese del venditore e sito eBay da interrogare per trovarlo.
# I venditori romeni, bulgari, giapponesi ecc. pubblicano su siti eBay diversi:
# se un paese non produce risultati, prova a cambiare il sito.
paesi:
  RO: EBAY_DE
  BG: EBAY_DE
  PL: EBAY_PL
  CZ: EBAY_DE
  SK: EBAY_DE
  HU: EBAY_DE
  HR: EBAY_DE
  SI: EBAY_DE
  EE: EBAY_DE
  LV: EBAY_DE
  LT: EBAY_DE
  GR: EBAY_DE
  DE: EBAY_DE
  AT: EBAY_AT
  GB: EBAY_GB
  JP: EBAY_US
  CN: EBAY_US
  HK: EBAY_US
  ES: EBAY_ES
  FR: EBAY_FR
  PT: EBAY_ES
  NL: EBAY_NL
  BE: EBAY_BE
  IE: EBAY_IE
  DK: EBAY_DE
  SE: EBAY_DE
  FI: EBAY_DE
  CH: EBAY_CH
  RS: EBAY_DE

# Paesi lontani: dogana, IVA all'importazione e tempi lunghi, ma prezzi spesso più bassi.
# Hanno una quota fissa di chiamate (quota_lontani) e ricevono solo i gruppi di ricerca per pezzi particolari,
# non quelli sull'usato comune, dove con spedizione e IVA non conviene quasi mai.
# eBay non ha siti dedicati a Indonesia, Sudafrica ecc.: si cerca sul sito americano per sede del venditore.
# In Africa c'è solo il Sudafrica: gli altri paesi sono quasi tutti senza protezione dell'acquirente reale.
paesi_lontani:
  AU: EBAY_AU
  NZ: EBAY_AU
  US: EBAY_US
  CA: EBAY_CA
  KR: EBAY_US
  TW: EBAY_US
  TH: EBAY_US
  MY: EBAY_US
  SG: EBAY_US
  PH: EBAY_US
  VN: EBAY_US
  ID: EBAY_US
  ZA: EBAY_US
  TR: EBAY_DE

# Stima del costo di importazione dai paesi fuori UE (Regno Unito, Svizzera, Giappone, Cina, Australia ecc.).
importazione:
  iva_importazione: 0.22
  soglia_sdoganamento_eur: 150
  costo_sdoganamento_eur: 12      # commissione tipica del corriere oltre la soglia
  dazio: 0.0                      # fotocamere e ottiche sono in genere esenti
  spedizione_stimata_eur: 25      # usata quando l'annuncio non indica il costo di spedizione

# Gruppi di ricerca. Le parentesi con le virgole significano "uno qualsiasi di questi".
ricerche:
  - nome: Fotocamere sovietiche e dell'Est
    q: "(zorki,fed,kiev,zenit,horizont,lomo,smena,salut,lubitel,moskva,sputnik,vega)"
  - nome: Ottiche sovietiche
    q: "(helios,jupiter,industar,tair,mir-1,zenitar,rubinar,volna,orion-15,peleng,kaleinar)"
  - nome: Medio e grande formato
    q: "(mamiya,bronica,fujica,pentacon six,rolleiflex,rolleicord,yashica mat,linhof,graflex,sinar,wista)"
  - nome: Ottiche e fotocamere tedesche e francesi
    q: "(meyer optik,trioplan,primoplan,biotar,exakta,zeiss ikon,contarex,voigtlander,angenieux,som berthiot)"
  - nome: Giapponesi particolari
    q: "(topcon,kowa,miranda,petri,konica hexar,olympus pen,olympus xa,ricoh gr1,pentax 67,canon 7)"
  - nome: Cinesi e ottiche moderne di nicchia
    q: "(seagull,phenix,great wall,pearl river,holga,ttartisan,7artisans,mitakon,laowa)"
  - nome: Formati e usi insoliti
    q: "(anamorphic,widelux,noblex,horizon 202,subminiature,minox,spy camera,stereo camera,panoramic camera,aerial camera)"
  - nome: Classici a buon prezzo
    classico: true                # avviso solo se è un affare, non per il punteggio
    lontani: false
    q: "(canon ae-1,pentax k1000,olympus om-1,nikon fm2,minolta x-700,yashica fx-3,canon a-1,pentax mx,praktica mtl)"
  - nome: Marche note a prezzo basso
    classico: true                # avviso solo se è un affare
    modalita: moderno             # compare solo nella scheda Moderno del sito
    q: "(sony a7,sony a6000,sony a6300,sony rx100,canon eos r,canon 5d,canon 6d,canon 80d,canon g7x,nikon d750,nikon d810,nikon z6,fujifilm x100,fujifilm x-t,panasonic gh5,leica q,olympus e-m)"
  - nome: Cinepresa e ottiche cine
    q: "(bolex,arriflex,super 8 camera,16mm camera,c-mount lens,cine lens,kinoptik,speed panchro,beaulieu,eclair)"
  - nome: Ottiche usate economiche
    classico: true
    lontani: false
    q: "(nikkor,canon fd,minolta rokkor,minolta md,takumar,smc pentax,zuiko,yashica ml,tamron adaptall,sigma 30mm,tokina)"
  - nome: Reflex e mirrorless usate economiche
    classico: true
    modalita: moderno
    q: "(canon eos 600d,canon eos 700d,canon eos 800d,canon eos 60d,canon eos 70d,nikon d3300,nikon d5300,nikon d5500,nikon d7000,nikon d7100,nikon d610,pentax k-5,sony nex-6,sony a5100,fujifilm x-e2,fujifilm x-t1,panasonic g7,olympus pen e-pl)"
  - nome: Ottiche moderne usate economiche
    classico: true
    modalita: moderno
    q: "(canon ef 50mm,canon ef 85mm,canon ef 24-70,canon ef 70-200,canon ef-s 18-55,nikon af-s,nikkor af-s,sony fe 50mm,sony fe 28-70,sony e 18-55,fujifilm xf 35mm,fujifilm xf 18-55,tamron sp 70-200,sigma art 35mm)"
  - nome: Compatte e telemetro a buon prezzo
    classico: true
    lontani: false
    q: "(olympus mju,yashica t4,contax t2,ricoh gr1,minolta tc-1,nikon 35ti,leica minilux,konica big mini,pentax espio,canon sure shot,canon autoboy)"

# Negozi e siti di usato, letti direttamente dalle loro pagine pubbliche.
# Cacciatore legge robots.txt di ogni sito e salta ciò che vieta. Per aggiungere un negozio basta
# copiare un blocco e cambiare nome e indirizzo; poi lancia "Verifica fonti" da Actions per controllare.
# Alla prima lettura di una fonte nuova nessun avviso: il catalogo esistente diventa la base di partenza.
fonti:
  - nome: Analogue Shop
    tipo: shopify                 # il negozio espone /products.json
    url: https://analogueshop.com
    paese: NL
    valuta: EUR
    ogni_minuti: 120
  - nome: Analogue Wonderland
    tipo: shopify
    url: https://analoguewonderland.co.uk
    paese: GB
    valuta: GBP                   # Regno Unito: il costo di importazione viene stimato
    ogni_minuti: 120
  - nome: Safelight Berlin
    tipo: shopify
    url: https://safelightberlin.com
    paese: DE
    valuta: EUR
    ogni_minuti: 120
  - nome: Kamerastore
    tipo: shopify
    url: https://kamerastore.com
    collezioni: [all]
    solo_usato: true              # il catalogo contiene anche nuovo, film e servizi
    paese: FI
    valuta: EUR
    ogni_minuti: 120
  - nome: Nikon Service Dresden
    tipo: shopify
    url: https://www.nikonservice-dresden.de
    collezioni: [kameras-gebrauchtware, objektive-gebrauchtware, zubehor-gebrauchtware]
    paese: DE
    valuta: EUR
    ogni_minuti: 120
  - nome: Japan Camera Hunter
    tipo: woocommerce
    url: https://www.japancamerahunter.com
    categoria: cameras-for-sale
    paese: JP
    valuta: USD
    ogni_minuti: 240
  # Etsy: API ufficiale con la tua chiave (secret ETSY_API_KEY ed ETSY_API_SECRET). Metti attivo: true quando le hai.
  - nome: Etsy
    tipo: etsy
    attivo: false
    parole:                       # una chiamata per frase; Etsy non capisce OR né virgolette
      - vintage lens m42
      - soviet lens
      - helios 44
      - jupiter lens
      - industar lens
      - zeiss jena lens
      - pentacon lens
      - vintage camera lens adapter
      - ussr camera
      - east german camera
      - japanese vintage lens
      - vintage rangefinder camera
    max_pagine: 1
    paese_ignoto: scarta          # se l'API non dice dove spedisce il venditore, l'annuncio non entra
    valuta: EUR
    ogni_minuti: 180
  # Subito e Vinted: Cacciatore non entra nei loro siti. Legge le mail di "ricerca salvata" che i siti mandano a te.
  # Servono i secret EMAIL_IMAP_UTENTE ed EMAIL_IMAP_PASSWORD (casella dedicata, password per app).
  - nome: Subito
    tipo: email
    attivo: false
    modalita: entrambe
    mittenti: ["subito.it"]
    link: "subito\\.it/"          # solo i link che puntano agli annunci
    giorni: 3
    paese: IT
    permetti_paesi: [IT]          # Subito è italiano: l'esclusione dei venditori italiani qui non vale
    valuta: EUR
    spedizione_stimata_eur: 8
    ogni_minuti: 30
  - nome: Vinted
    tipo: email
    attivo: false
    modalita: entrambe
    mittenti: ["vinted"]
    link: "vinted\\.[a-z.]+/items/"
    giorni: 3
    paese_da_dominio: true        # vinted.it -> IT, vinted.fr -> FR ... (è il sito, non per forza il paese del venditore)
    permetti_paesi: [IT]
    valuta: EUR
    spedizione_stimata_eur: 8
    ogni_minuti: 30
  # Modelli per altri tipi di sito (togli il cancelletto e compila):
  #
  # - nome: Negozio WooCommerce
  #   tipo: woocommerce           # espone /wp-json/wc/store/v1/products
  #   url: https://esempio.com
  #   paese: DE
  #   valuta: EUR
  #
  # - nome: Sito con dati strutturati
  #   tipo: jsonld                # pagine di elenco con schema.org Product (quasi tutti i negozi moderni)
  #   url: https://esempio.com
  #   urls:                       # le pagine di elenco da leggere
  #     - https://esempio.com/categoria/fotocamere-usate
  #     - https://esempio.com/categoria/obiettivi-usati
  #   paese: FR
  #   valuta: EUR
  #
  # - nome: Feed di annunci
  #   tipo: rss
  #   url: https://esempio.com
  #   urls: [https://esempio.com/feed.xml]
  #   paese: CZ
  #   valuta: CZK
  #
  # - nome: Sito senza dati strutturati
  #   tipo: html
  #   url: https://esempio.com
  #   urls: [https://esempio.com/usato]
  #   paese: PL
  #   valuta: PLN
  #   selettori:                  # selettori CSS
  #     voce: ".product-item"
  #     titolo: ".product-title"
  #     prezzo: ".price"
  #     link: "a"
  #     immagine: "img"

# Scheda Moderno del sito: solo fotocamere e obiettivi; queste parole scartano accessori e pezzi guasti.
moderno:
  escludi_titolo:
    - battery
    - batteria
    - grip
    - charger
    - caricabatterie
    - strap
    - tracolla
    - bag
    - borsa
    - case only
    - cover
    - manual
    - box only
    - empty box
    - lens cap
    - hood
    - paraluce
    - for parts
    - parts only
    - broken
    - defective
    - faulty
    - non funzionante
    - per ricambi
    - screen protector
    - filter
    - tripod
    - flash only
    - cage
    - mount adapter
    - viewfinder only

negozi:
  tieni_tutto: true               # mostra sul sito tutto il catalogo usato dei negozi, non solo i pezzi rari (restano scartati film, borse, ecc.)
  pausa_secondi: 2.0              # attesa tra due richieste allo stesso sito
  # i negozi vendono anche accessori e materiale di consumo: questi titoli vengono scartati
  escludi_titolo:
